# Análisis estático de seguridad de GitHub (CodeQL) sobre el código TypeScript y JavaScript.
# Gratis en repositorios públicos. Los hallazgos salen en la pestaña Security del repositorio.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  analizar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # Además de las reglas por defecto, las de seguridad más amplias.
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
